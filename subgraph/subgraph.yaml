specVersion: 0.0.7
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: LogStorage
    network: sepolia
    source:
      address: "0x262A8669334eE0001295b15a8076E3A3B694E4dc" # replace with deployed address
      abi: LogStorage
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LogEntry
      abis:
        - name: LogStorage
          file: ./abis/LogStorage.json
      eventHandlers:
        - event: DataLogged(indexed address,indexed uint256,string,uint256)
          handler: handleDataLogged
      file: ./src/mapping.ts
