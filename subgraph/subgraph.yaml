specVersion: 0.0.7
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: LogStorage
    network: sepolia
    source:
      address: "0x8C7488B67Fcc38Ef2d88946B58a8b26e327b721E" # replace with deployed address
      abi: LogStorage
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LogEntry
        - TransferEntry
      abis:
        - name: LogStorage
          file: ./abis/LogStorage.json
      eventHandlers:
        - event: DataLogged(indexed address,indexed uint256,string,uint256)
          handler: handleDataLogged
        - event: TransferLogged(indexed address,indexed address,uint256,uint256)
          handler: handleTransferLogged
      file: ./src/mapping.ts
