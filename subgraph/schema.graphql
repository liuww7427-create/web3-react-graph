type LogEntry @entity(immutable: false) {
  id: ID!
  txHash: Bytes!
  sender: Bytes!
  data: String!
  timestamp: BigInt!
  contractAddress: Bytes!
  chainId: BigInt!
}

type TransferEntry @entity(immutable: false) {
  id: ID!
  txHash: Bytes!
  from: Bytes!
  to: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  contractAddress: Bytes!
  chainId: BigInt!
}
